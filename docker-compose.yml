services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ortho_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      BACKEND_PRIVATE_IP: "10.0.2.194"  # Replace with EC2-2's actual Private IP
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
